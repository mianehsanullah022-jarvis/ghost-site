const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const STORE = 'ghost-site-key';

async function keyFrom(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, 256));
}

async function open(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c)));
  document.open(); document.write(html); document.close();
}

// Opened before on this device? (waits for the page to finish loading first)
window.addEventListener('load', async () => {
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch (_) {}
  if (!saved) return;
  try { await open(b64(saved)); } catch (_) { try { localStorage.removeItem(STORE); } catch (_) {} }
});

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';
  try {
    const keep = document.getElementById('keep').checked;
    const raw = await keyFrom(document.getElementById('pw').value);
    await open(raw);
    if (keep) { try { localStorage.setItem(STORE, btoa(String.fromCharCode(...raw))); } catch (_) {} }
  } catch (_) {
    btn.disabled = false; btn.textContent = 'Open the website';
    err.textContent = 'That password is not right. Check it and try again.';
  }
});
</script>
