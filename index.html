<style>
:root{--night:#030806;--moss:#0B1A10;--line:#1E3A27;--green:#16EF62;--ink:#EEF7F0;--fog:#9AAEA1;--chai:#F2B84B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(60% 50% at 50% 35%,rgba(22,239,98,.13),transparent 70%),var(--night);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(380px,100%);text-align:center}
img.g{width:170px;height:182px;margin:0 auto 6px;display:block;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){img.g{animation:none}}
h1{font-size:26px;font-weight:800;letter-spacing:.02em}
p{color:var(--fog);margin-top:6px}
form{margin-top:26px;display:grid;gap:12px}
input[type=password]{width:100%;font:inherit;font-size:17px;color:var(--ink);background:#06100A;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
input[type=password]:focus{outline:none;border-color:var(--green)}
label.keep{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--fog);font-size:14px}
button{font:inherit;font-weight:700;font-size:16px;color:#03200E;background:var(--green);border:0;border-radius:999px;padding:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.err{color:var(--chai);min-height:22px;font-size:15px}
</style>
</head>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const STORE = 'ghost-site-key';

async function keyFrom(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, 256));
}

async function open(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c)));
  document.open(); document.write(html); document.close();
}

// Opened before on this device? (waits for the page to finish loading first)
window.addEventListener('load', async () => {
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch (_) {}
  if (!saved) return;
  try { await open(b64(saved)); } catch (_) { try { localStorage.removeItem(STORE); } catch (_) {} }
});

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';
  try {
    const keep = document.getElementById('keep').checked;
    const raw = await keyFrom(document.getElementById('pw').value);
    await open(raw);
    if (keep) { try { localStorage.setItem(STORE, btoa(String.fromCharCode(...raw))); } catch (_) {} }
  } catch (_) {
    btn.disabled = false; btn.textContent = 'Open the website';
    err.textContent = 'That password is not right. Check it and try again.';
  }
});
</script>
